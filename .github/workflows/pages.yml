name: Deploy AR Studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog and scripts
        run: npm run check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live brand stylesheet
        shell: bash
        run: |
          set -euo pipefail
          base="https://deepanalytica.github.io/arestudio/brand"
          for attempt in $(seq 1 12); do
            html=$(curl --fail --silent --show-error --location --max-time 15 "$base/?check=${GITHUB_SHA}" || true)
            css=$(curl --fail --silent --show-error --location --max-time 15 "$base/brand.css?v=2.3.1&check=${GITHUB_SHA}" || true)
            lab=$(curl --fail --silent --show-error --location --max-time 15 "$base/lab/?check=${GITHUB_SHA}" || true)
            if [[ "$html" == *'brand.css?v=2.3.1'* && "$css" == *'--ar-brand-css-loaded:1'* && "$lab" == *'../brand.css?v=2.3.1'* ]]; then
              echo "Pages: HTML, Brand CSS and Design System Lab are serving version 2.3.1"
              exit 0
            fi
            echo "Waiting for GitHub Pages CDN propagation ($attempt/12)"
            sleep 5
          done
          echo 'ERROR: GitHub Pages is not serving matching HTML/CSS'
          exit 1