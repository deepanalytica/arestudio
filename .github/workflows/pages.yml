name: Deploy AR Studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog and scripts
        run: npm run check
      - name: Install browser capture tools
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture live evidence from public products
        run: node scripts/capture-public-evidence.mjs
      - name: QA AR Estudio Comercial
        run: node scripts/qa-commercial.mjs
      - name: Save commercial screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-comercial-${{ github.run_number }}
          path: qa-output/comercial/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove QA capture files from published site
        run: rm -rf qa-output
      - name: Remove build-only dependencies
        run: rm -rf node_modules
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Allow Pages artifact registration
        run: sleep 15
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live brand stylesheet
        shell: bash
        run: |
          set -euo pipefail
          base="https://deepanalytica.github.io/arestudio/brand"
          for attempt in $(seq 1 12); do
            html=$(curl --fail --silent --show-error --location --max-time 15 "$base/?check=${GITHUB_SHA}" || true)
            css=$(curl --fail --silent --show-error --location --max-time 15 "$base/brand.css?v=2.3.1&check=${GITHUB_SHA}" || true)
            lab=$(curl --fail --silent --show-error --location --max-time 15 "$base/lab/?check=${GITHUB_SHA}" || true)
            profile=$(curl --fail --silent --show-error --location --max-time 15 "https://deepanalytica.github.io/arestudio/perfil/?check=${GITHUB_SHA}" || true)
            proof=$(curl --fail --silent --show-error --location --max-time 15 "https://deepanalytica.github.io/arestudio/assets/proof/manifest.json?check=${GITHUB_SHA}" || true)
            if [[ "$html" == *'brand.css?v=2.3.1'* && "$css" == *'--ar-brand-css-loaded:1'* && "$lab" == *'../brand.css?v=2.3.1'* && "$profile" == *'id="areas-title"'* && "$proof" == *'"results"'* ]]; then
              echo "Pages: brand, profile and public evidence manifest are published"
              exit 0
            fi
            echo "Waiting for GitHub Pages CDN propagation ($attempt/12)"
            sleep 5
          done
          echo 'ERROR: GitHub Pages is not serving matching HTML/CSS'
          exit 1
      - name: Verify commercial landing route
        shell: bash
        run: |
          set -euo pipefail
          base="https://deepanalytica.github.io/arestudio/comercial"
          for attempt in $(seq 1 12); do
            html=$(curl --fail --silent --show-error --location --max-time 15 "$base/?qa=${GITHUB_SHA}" || true)
            css=$(curl --fail --silent --show-error --location --max-time 15 "$base/experience.css?qa=${GITHUB_SHA}" || true)
            script=$(curl --fail --silent --show-error --location --max-time 15 "$base/experience.js?qa=${GITHUB_SHA}" || true)
            if [[ "$html" == *'class="solution-tile'* && "$html" == *'id="journey-canvas"'* && "$html" == *'id="lead-form"'* && "$css" == *'.solution-grid'* && "$script" == *'function selectService'* ]]; then
              echo "Commercial landing live: service selector, journey, form, design system and JavaScript"
              exit 0
            fi
            echo "Waiting for commercial Pages propagation ($attempt/12)"
            sleep 5
          done
          echo "ERROR: Commercial page or assets not available at latest revision"
          exit 1
