name: Visual QA · AR Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependency
        run: npm install --no-save playwright
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop, tablet and mobile UI
        run: node tests/browser-qa.mjs
      - name: Upload audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-studio-visual-qa
          path: artifacts/
          if-no-files-found: ignore